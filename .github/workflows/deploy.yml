name: Build & publish for Hostinger

# Builds the Next.js site into static files and pushes them to the `deploy` branch.
# Hostinger's Git deployment pulls the `deploy` branch into public_html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Publish ./out to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
          enable_jekyll: true
          commit_message: "Deploy ${{ github.sha }}"
